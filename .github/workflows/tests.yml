name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[ai,dev]"
      - run: python -m pytest -q
      - run: python -m compileall -q repopilot scripts
      - run: python scripts/verify_release.py
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,ui-test]"
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/check_ui.py
  docker-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: docker build -t repopilot-sandbox:1 -f sandbox/Dockerfile .
      - run: python -m pytest tests/test_sandbox.py -q
