[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repopilot-studio"
version = "1.1.0"
description = "Local-first repository investigation, reviewed code changes and isolated tests"
requires-python = ">=3.11"
readme = "README.md"
license = {file = "LICENSE"}
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3",
  "httpx>=0.27,<1", "pathspec>=0.12,<2", "markdown-it-py>=3,<5",
  "python-multipart>=0.0.20,<1"
]
[project.optional-dependencies]
ai = ["langgraph>=1.0,<2", "langchain-openai>=1.0,<2", "langgraph-checkpoint-sqlite>=3,<4"]
postgres = ["langgraph-checkpoint-postgres>=3,<4", "psycopg[binary,pool]>=3.2,<4"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "httpx>=0.27,<1"]
ui-test = ["playwright>=1.50,<2"]

[tool.setuptools.packages.find]
include = ["repopilot*"]
namespaces = false
[tool.setuptools.package-data]
repopilot = ["static/*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
